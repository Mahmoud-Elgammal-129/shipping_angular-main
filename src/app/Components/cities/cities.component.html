<div class="mt-5">
  <div class="container">
    <a routerLink="/add-city" class="btn btn-primary mb-5">اضافة مدينة</a>
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">الاسم</th>
          <th scope="col">تكلفة الشحن العادى</th>
          <th scope="col">الحالة</th>
    
          <th scope="col">الاعدادات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let city of Cities; let i= index;">
          <th scope="row">{{  i+1 }}</th>
          <td>{{ city.name }}</td>
          <td>{{ city.regular_Shipping }}</td>
    
          <td>{{ city.isDeleted }}</td>
          <td>
            <!-- <a [routerLink]="['/add-city', city.id]" class="btn btn-outline-warning"
              >Edit</a
            >|
            <a (click)="deleteCity(city.id)" class="btn btn-outline-danger"
              >Delete</a
            > -->
            <i [routerLink]="['/add-city', city.id]"class="fs-3 mx-1 text-info bi bi-pencil-square"></i>
            <i  (click)="deleteCity(city.id)" class=" fs-3 mx-1 text-danger bi bi-trash3-fill"></i>
            <!-- <i class=" fs-3 mx-1  text-warning bi-eye-fill"></i> -->
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
